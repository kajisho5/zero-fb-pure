name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Load measurement (PF-1, recorded only)
        shell: bash
        run: |
          if [ -f build/Release/zfp_bench.exe ]; then build/Release/zfp_bench.exe; else build/zfp_bench; fi

  plugin:
    name: plugin / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      PLUGINVAL_VERSION: v1.0.4
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DZFP_BUILD_PLUGIN=ON -DZFP_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build --config Release --parallel

      # ---- macOS: Universal の確認、pluginval（VST3・AU）、auval
      - name: Check universal binary (macOS)
        if: runner.os == 'macOS'
        run: |
          lipo -archs "build/ZeroFbPure_artefacts/Release/VST3/ZERO-FB PURE.vst3/Contents/MacOS/ZERO-FB PURE" | tee archs.txt
          grep -q arm64 archs.txt && grep -q x86_64 archs.txt
      - name: Install AU and get pluginval (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/ZeroFbPure_artefacts/Release/AU/ZERO-FB PURE.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_macOS.zip"
          unzip -q pluginval.zip
      - name: HC-2 auval (macOS)
        if: runner.os == 'macOS'
        run: auval -v aufx Zfbp Svwl
      - name: HC-1 pluginval VST3 (macOS)
        if: runner.os == 'macOS'
        run: pluginval.app/Contents/MacOS/pluginval --strictness-level 8 --validate-in-process --validate "build/ZeroFbPure_artefacts/Release/VST3/ZERO-FB PURE.vst3"
      - name: HC-1 pluginval AU (macOS)
        if: runner.os == 'macOS'
        run: pluginval.app/Contents/MacOS/pluginval --strictness-level 8 --validate-in-process --validate "$HOME/Library/Audio/Plug-Ins/Components/ZERO-FB PURE.component"

      # ---- Windows: pluginval（VST3）
      - name: HC-1 pluginval VST3 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/Tracktion/pluginval/releases/download/$env:PLUGINVAL_VERSION/pluginval_Windows.zip" -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval
          & pluginval\pluginval.exe --strictness-level 8 --validate-in-process --validate "build\ZeroFbPure_artefacts\Release\VST3\ZERO-FB PURE.vst3"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 署名・公証はまだ行っていない（配布用ではない確認用のビルド）。
      - uses: actions/upload-artifact@v7
        with:
          name: zero-fb-pure-unsigned-${{ runner.os }}
          path: build/ZeroFbPure_artefacts/Release
          if-no-files-found: error
